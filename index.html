<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>PRIME SERVICE</title>
<meta property="og:title" content="PRIME - SERVICE">
<meta property="og:description" content="كل روابطي في مكان واحد">
<style>
:root{
  --bg:#0a0a12; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.12);
  --txt:#f4f4f6; --muted:#a8a8b6;
  --tt:#25F4EE; --ig1:#f09433; --ig2:#dc2743; --ig3:#bc1888;
  --fb:#1877F2; --tel:#34C759;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;min-height:100vh;min-height:100dvh;
  padding:calc(44px + env(safe-area-inset-top)) 20px calc(36px + env(safe-area-inset-bottom));
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:radial-gradient(circle at 80% 0%,#2a1a4d,var(--bg) 60%);
  color:var(--txt);
  display:flex;justify-content:center;align-items:flex-start;
  overflow-x:hidden;
}

/* ---------- الخلفية ---------- */
.bg{
  position:fixed;inset:0;z-index:-2;
  background-image:url("Q.webp");
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(8,8,14,.62) 0%,rgba(8,8,14,.78) 45%,rgba(8,8,14,.9) 100%);
}
.orb{position:fixed;border-radius:50%;filter:blur(95px);pointer-events:none;z-index:-1}
.orb.a{width:330px;height:330px;background:var(--ig2);opacity:.38;top:-110px;right:-100px;animation:drift 15s ease-in-out infinite}
.orb.b{width:300px;height:300px;background:var(--tt);opacity:.22;bottom:-120px;left:-100px;animation:drift 19s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate3d(0,50px,0) scale(1.18)}}

/* ---------- الحاوية ---------- */
.wrap{position:relative;z-index:1;width:min(100%,420px);text-align:center}

.avatar{
  width:96px;height:96px;border-radius:50%;margin:0 auto 18px;display:block;
  object-fit:cover;background:linear-gradient(135deg,var(--ig2),var(--ig1));
  box-shadow:0 0 0 4px rgba(255,255,255,.1),0 16px 44px -10px rgba(0,0,0,.7);
  animation:pop .6s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes pop{from{opacity:0;transform:scale(.8)}}

h1{
  font-size:23px;margin:0 0 8px;letter-spacing:-.2px;
  text-shadow:0 2px 14px rgba(0,0,0,.8);
  animation:rise .5s .05s both;
}
.bio{
  margin:0 auto;color:#c9c9d6;font-size:14.5px;line-height:1.6;
  max-width:300px;text-shadow:0 2px 12px rgba(0,0,0,.9);
  animation:rise .5s .1s both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* ---------- الروابط ---------- */
.links{display:grid;gap:12px;margin-top:30px}
.link{
  display:flex;align-items:center;gap:14px;padding:14px 18px;
  border-radius:16px;background:var(--card);border:1px solid var(--line);
  color:var(--txt);text-decoration:none;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;
  opacity:0;animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards;
  animation-delay:calc(var(--i)*70ms + 150ms);
  text-align:start;
}
.link:hover{transform:translateY(-3px);background:rgba(255,255,255,.13)}
.link:active{transform:scale(.98)}
.link:focus-visible{outline:2px solid #fff;outline-offset:3px}
.link.tt:hover{border-color:rgba(37,244,238,.45);box-shadow:0 12px 32px -10px rgba(37,244,238,.5)}
.link.ig:hover{border-color:rgba(220,39,67,.45);box-shadow:0 12px 32px -10px rgba(220,39,67,.55)}
.link.fb:hover{border-color:rgba(24,119,242,.45);box-shadow:0 12px 32px -10px rgba(24,119,242,.55)}
.link.tel:hover{border-color:rgba(52,199,89,.45);box-shadow:0 12px 32px -10px rgba(52,199,89,.5)}

.ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center}
.ic svg{width:19px;height:19px}
.link.tt .ic{background:rgba(37,244,238,.14);color:var(--tt)}
.link.ig .ic{background:rgba(220,39,67,.16);color:#ff5c8a}
.link.fb .ic{background:rgba(24,119,242,.16);color:#5aa3ff}
.link.tel .ic{background:rgba(52,199,89,.16);color:var(--tel)}

.meta{display:grid;gap:2px;min-width:0}
.meta b{font-size:15px;font-weight:600}
.meta span{font-size:12.5px;color:var(--muted);direction:ltr;text-align:start;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrow{margin-inline-start:auto;opacity:.4;font-size:15px;transition:.18s}
.link:hover .arrow{opacity:.9;transform:translate(-3px,-3px)}

footer{margin-top:28px;color:#8e8e9c;font-size:12px;animation:rise .5s .45s both}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;opacity:1!important;transition:none!important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="wrap">

</body>
</html>
